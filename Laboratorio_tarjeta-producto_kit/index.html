<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica de laboratorio · tarjeta-producto</title>
  <link rel="stylesheet" href="./estilos.css">

  <!-- PASO 1 · La página solo importa el módulo del componente.
       Ábrela con Live Server: los módulos no cargan con file:// -->
  <script type="module" src="./componentes/tarjeta-producto.js"></script>
</head>
<body>
  <!-- Cambia el título por el nombre de tu emprendimiento -->
  <h1>Nombre de tu emprendimiento</h1>

  <!-- PASO 4 · Usa la tarjeta tres veces con productos REALES de tu emprendimiento:
       cambia la foto, el nombre, la descripción y el precio de cada una. -->
  <main class="catalogo">

    <tarjeta-producto precio="0">
      <img slot="foto" src="./img/producto-1.svg" alt="Describe la foto del producto 1">
      <h3 slot="nombre">Producto 1</h3>
      <p>Descripción corta del producto 1</p>
    </tarjeta-producto>

    <tarjeta-producto precio="0">
      <img slot="foto" src="./img/producto-2.svg" alt="Describe la foto del producto 2">
      <h3 slot="nombre">Producto 2</h3>
      <p>Descripción corta del producto 2</p>
    </tarjeta-producto>

    <tarjeta-producto precio="0">
      <img slot="foto" src="./img/producto-3.svg" alt="Describe la foto del producto 3">
      <h3 slot="nombre">Producto 3</h3>
      <p>Descripción corta del producto 3</p>
    </tarjeta-producto>

  </main>
</body>
</html>
