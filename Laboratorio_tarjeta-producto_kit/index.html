<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animales en Acción</title>
  <link rel="stylesheet" href="./estilos.css">

  <!-- ¡AGREGA ESTA LÍNEA! Es la importación de tu componente -->

</head>

<body>
  <h1>Peluquería Animales en Acción</h1>

  <main>
    <h2>Selecciona la raza de tu mascota</h2>
    <div class="catalogo">
      <selector-raza tamano="pequeno" precio="15">
        <img slot="foto"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFKBYSSTgJLpuG7JsVV44u385xhCI2FIip5UuehQGFGI7iaR70x2sfMArl&s=10">
        <h3 slot="nombre">Raza pequeña</h3>
        <p>Perros de hasta 10 kg.</p>
        <button slot="boton" disabled>Elegir</button>
      </selector-raza>

      <selector-raza tamano="mediano" precio="20" destacado>
        <img slot="foto"
          src="https://static.vecteezy.com/system/resources/previews/030/012/303/non_2x/cute-white-schnauzer-standing-in-a-white-studio-floor-photo.jpg"
          alt="Schnauzer de pie">
        <h3 slot="nombre">Raza mediana</h3>
        <p>Perros de 10 a 25 kg.</p>
        <button slot="boton" disabled>Elegir</button>
      </selector-raza>

      <selector-raza tamano="grande" precio="28"><img slot="foto"
          src="https://www.purina.es/sites/default/files/styles/ttt_image_510/public/2024-02/sitesdefaultfilesstylessquare_medium_440x440public2022-09flatcoated20retriever.jpg?itok=RBKTGGnh"
          alt="Golden Retriever en el parque">
        <h3 slot="nombre">Raza grande</h3> <button slot="boton" disabled>Elegir</button>
      </selector-raza>
    </div>

    <br>
    <br>

    <div class="fila-reserva">

      <section class="seccion">
        <h2>Reserva tu turno</h2>
        <calendario-citas fecha="2026-10-20">
          <span slot="titulo">📅 ¿Cuándo nos visitas?</span>
        </calendario-citas>
      </section>

      <section class="seccion">
        <resumen-cotizacion></resumen-cotizacion>
      </section>
      
    </div>

  </main>
  <script type="module" src="./componentes/selector-raza.js"></script>
  <script type="module" src="./componentes/calendario-citas.js"></script>
  <script type="module" src="./componentes/resumen-cotizacion.js"></script>
</body>

</html>
