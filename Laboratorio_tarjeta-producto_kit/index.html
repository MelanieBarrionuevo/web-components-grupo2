<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica de laboratorio · tarjeta-producto</title>
  <link rel="stylesheet" href="./estilos.css">

  <!-- PASO 1 · La página solo importa el módulo del componente.
       Ábrela con Live Server: los módulos no cargan con file:// -->
</head>
<body>
  <!-- Cambia el título por el nombre de tu emprendimiento -->
  <h1>Animales en accion</h1>
  <!-- PASO 4 · Usa la tarjeta tres veces con productos REALES de tu emprendimiento:
       cambia la foto, el nombre, la descripción y el precio de cada una. -->
  <main class="catalogo">

  <selector-raza tamano="pequeno" precio="15">
    <img slot="foto" src="./img/pequeno.jpg" alt="Caniche toy sentado">
    <h3 slot="nombre">Raza pequeña</h3>
    <p>Perros de hasta 10 kg.</p>
    <button slot="boton" disabled>Elegir</button>
  </selector-raza>

  <selector-raza tamano="mediano" precio="20" destacado>
    <img slot="foto" src="./img/mediano.jpg" alt="Schnauzer de pie">
    <h3 slot="nombre">Raza mediana</h3>
    <p>Perros de 10 a 25 kg.</p>
    <button slot="boton" disabled>Elegir</button>
  </selector-raza>

  <!-- Sin descripción y en una sola línea: muestra "Sin descripción" -->
  <selector-raza tamano="grande" precio="28"><img slot="foto" src="./img/grande.jpg" alt="Golden Retriever en el parque"><h3 slot="nombre">Raza grande</h3> <button slot="boton" disabled>Elegir</button> > </selector-raza>

</main>
  <script type="module" src="./componentes/selector-raza.js"></script>

</body>
</html>
