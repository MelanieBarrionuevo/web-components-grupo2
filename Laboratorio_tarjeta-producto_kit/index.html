<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animales en Acción</title>
  <link rel="stylesheet" href="./estilos.css">

  <!-- IMPORTACIÓN DE LOS MÓDULOS -->
  <script type="module" src="./componentes/tarjeta-producto.js"></script>
  
  <!-- ¡AGREGA ESTA LÍNEA! Es la importación de tu componente -->
  <script type="module" src="./componentes/calendario-citas.js"></script>
</head>
<body>
  <h1>Peluquería Animales en Acción</h1>

  <main class="catalogo">
    <!-- Aquí están las tarjetas del Atleta 1... -->
    <tarjeta-producto precio="12">
      <img slot="foto" src="./img/producto-1.svg" alt="...">
      <h3 slot="nombre">Baño Completo</h3>
      <p>Baño hipoalergénico, secado, cepillado y perfume</p>
    </tarjeta-producto>
    
    <!-- ... asumiendo que están las otras tarjetas ... -->
  </main>

  <hr>

  <!-- AQUÍ PONES TU PARTE COMO ATLETA 3 -->
  <section>
    <h2>Reserva tu turno</h2>
    
    <!-- ===== ATLETA 3 calendario-citas ===== -->
    <calendario-citas fecha="2026-10-20">
        <span slot="titulo">📅 ¿Cuándo nos visitas?</span>
    </calendario-citas>
    <!-- ===== FIN ATLETA 3 ===== -->
  </section>
  <!-- PASO 1 · La página solo importa el módulo del componente.
       Ábrela con Live Server: los módulos no cargan con file:// -->
</head>
<body>
  <!-- Cambia el título por el nombre de tu emprendimiento -->
  <h1>Animales en accion</h1>
  <!-- PASO 4 · Usa la tarjeta tres veces con productos REALES de tu emprendimiento:
       cambia la foto, el nombre, la descripción y el precio de cada una. -->
  <main class="catalogo">

  <selector-raza tamano="pequeno" precio="15">
    <img slot="foto" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFKBYSSTgJLpuG7JsVV44u385xhCI2FIip5UuehQGFGI7iaR70x2sfMArl&s=10">
    <h3 slot="nombre">Raza pequeña</h3>
    <p>Perros de hasta 10 kg.</p>
    <button slot="boton" disabled>Elegir</button>
  </selector-raza>

  <selector-raza tamano="mediano" precio="20" destacado>
    <img slot="foto" src="https://static.vecteezy.com/system/resources/previews/030/012/303/non_2x/cute-white-schnauzer-standing-in-a-white-studio-floor-photo.jpg" alt="Schnauzer de pie">
    <h3 slot="nombre">Raza mediana</h3>
    <p>Perros de 10 a 25 kg.</p>
    <button slot="boton" disabled>Elegir</button>
  </selector-raza>

  <selector-raza tamano="grande" precio="28"><img slot="foto" src="https://www.purina.es/sites/default/files/styles/ttt_image_510/public/2024-02/sitesdefaultfilesstylessquare_medium_440x440public2022-09flatcoated20retriever.jpg?itok=RBKTGGnh" alt="Golden Retriever en el parque"><h3 slot="nombre">Raza grande</h3> <button slot="boton" disabled>Elegir</button> </selector-raza>

</main>
  <script type="module" src="./componentes/selector-raza.js"></script>

</body>
</html>
